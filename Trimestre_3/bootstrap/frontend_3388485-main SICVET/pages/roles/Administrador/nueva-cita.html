<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SICVET - Nueva Cita</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../styles.css">
</head>
<body class="bg-light">

  <div class="d-flex">
    <!-- Sidebar / Menú Lateral -->
    <aside class="bg-white border-end d-flex flex-column justify-content-between p-3 min-vh-100 sicvet-inline-style-006">
      <div>
        <!-- Logo -->
        <div class="d-flex align-items-center gap-2 mb-4 px-2">
        <div class=" rounded-3 d-flex align-items-center justify-content-center p-1 shadow-sm overflow-hidden sicvet-inline-style-007">
            <img src="/assets/dashboard/img/logo.png" alt="logo huella" class="img-fluid w-100 h-100 object-fit-contain">
            <i class="bi bi-paw-fill"></i>
          </div>
          <div>
            <h6 class="fw-bold mb-0">SICVET</h6>
            <small class="text-muted d-block sicvet-inline-style-008">Gestión Veterinaria</small>
          </div>
        </div>

        <!-- Links Principales del Administrador -->
        <div class="nav nav-pills flex-column gap-1">
          <a class="nav-link text-secondary d-flex align-items-center gap-2" href="dashboard.html"><i class="bi bi-house"></i> Dashboard</a>
          <a class="nav-link text-secondary d-flex align-items-center gap-2" href="agenda.html"><i class="bi bi-calendar-week"></i> Agenda</a>
          <a class="nav-link text-secondary d-flex align-items-center gap-2" href="clientes.html"><i class="bi bi-people"></i> Clientes y Mascotas</a>
          <a class="nav-link text-secondary d-flex align-items-center gap-2" href="usuarios.html"><i class="bi bi-shield-check"></i> Usuarios y Roles</a>
          <a class="nav-link active d-flex align-items-center gap-2" href="nueva-cita.html"><i class="bi bi-plus-circle"></i> Nueva Cita</a>
          <a class="nav-link text-secondary d-flex align-items-center gap-2" href="historial-citas.html"><i class="bi bi-file-earmark-text"></i> Historial de Citas</a>
        </div>
      </div>

      <!-- Pie del Menú Lateral -->
      <div class="pt-3 border-top">
        <a href="#" class="text-decoration-none text-secondary d-flex align-items-center gap-2 mb-2 small px-2"><i class="bi bi-person"></i> Mi Perfil</a>
        <a href="/Home.html" class="text-decoration-none text-danger d-flex align-items-center gap-2 mb-3 small px-2"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a>
        <div class="d-flex align-items-center gap-2 px-2">
          <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold sicvet-inline-style-009">AS</div>
          <div>
            <p class="fw-bold mb-0 small">Administrador SICVET</p>
            <small class="text-muted d-block sicvet-inline-style-008">Administrador</small>
          </div>
        </div>
      </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-grow-1 min-vh-100">
      <!-- Header Superior -->
      <header class="d-flex justify-content-between align-items-center p-3 px-4 bg-white border-bottom">
        <h5 class="fw-bold mb-0">Nueva Cita</h5>
        <div class="d-flex align-items-center gap-3">
          <i class="bi bi-bell text-secondary"></i>
          <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold sicvet-inline-style-009">AS</div>
          <div class="d-none d-md-block">
            <p class="fw-bold mb-0 small">Administrador</p>
            <small class="text-muted d-block sicvet-inline-style-008">Administrador</small>
          </div>
        </div>
      </header>

      <div class="p-4 d-flex justify-content-center">
        <!-- Tarjeta del Formulario -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden sicvet-inline-style-016">
          <!-- Encabezado Azul de la Tarjeta -->
          <div class="bg-primary text-white p-4">
            <h5 class="fw-bold mb-1">Nueva Cita</h5>
            <p class="small mb-0 opacity-75">Complete los datos para agendar</p>
          </div>

          <!-- Formulario -->
          <form class="p-4">
            <!-- Selección de Cliente -->
            <div class="mb-3">
              <label class="form-label text-uppercase text-secondary fw-bold sicvet-inline-style-008">CLIENTE</label>
              <select class="form-select border rounded-3 shadow-none">
                <option selected disabled>Seleccionar cliente...</option>
                <option value="1">María García López (maria.garcia@email.com)</option>
                <option value="2">Carlos Rodríguez Silva (carlos.rod@email.com)</option>
                <option value="3">Ana Martínez Torres (ana.martinez@email.com)</option>
                <option value="4">Luis Hernández Pérez (luis.hd@email.com)</option>
              </select>
            </div>

            <!-- Selección de Mascota -->
            <div class="mb-3">
              <label class="form-label text-uppercase text-secondary fw-bold sicvet-inline-style-008">MASCOTA</label>
              <select class="form-select border rounded-3 shadow-none">
                <option selected disabled>Seleccionar mascota...</option>
                <option value="1">Luna (Perro - Golden Retriever)</option>
                <option value="2">Mimi (Gato - Persa)</option>
                <option value="3">Rocky (Perro - Mestizo)</option>
                <option value="4">Max (Perro - Poodle)</option>
              </select>
            </div>

            <!-- Selección de Servicio -->
            <div class="mb-3">
              <label class="form-label text-uppercase text-secondary fw-bold sicvet-inline-style-008">SERVICIO</label>
              <select class="form-select border rounded-3 shadow-none">
                <option selected disabled>Seleccionar servicio...</option>
                <option value="1">Consulta General</option>
                <option value="2">Vacunación</option>
                <option value="3">Peluquería</option>
                <option value="4">Baño y Grooming</option>
              </select>
            </div>

            <!-- Asignar Profesional -->
            <div class="mb-3">
              <label class="form-label text-uppercase text-secondary fw-bold sicvet-inline-style-008">VETERINARIO / PERSONAL</label>
              <select class="form-select border rounded-3 shadow-none">
                <option selected disabled>Seleccionar profesional...</option>
                <option value="1">Dr. Alejandro Rivas (Medicina General)</option>
                <option value="2">Dra. Valentina Suárez (Cirugía)</option>
                <option value="3">Marcos Delgado (Estética Canina)</option>
              </select>
            </div>

            <!-- Fecha y Hora -->
            <div class="row g-2 mb-4">
              <div class="col-6">
                <label class="form-label text-uppercase text-secondary fw-bold sicvet-inline-style-008">FECHA</label>
                <input type="date" class="form-control border rounded-3 shadow-none">
              </div>
              <div class="col-6">
                <label class="form-label text-uppercase text-secondary fw-bold sicvet-inline-style-008">HORA</label>
                <select class="form-select border rounded-3 shadow-none">
                  <option selected disabled>Seleccionar hora...</option>
                  <option value="08:00">08:00 AM</option>
                  <option value="09:00">09:00 AM</option>
                  <option value="10:30">10:30 AM</option>
                  <option value="11:00">11:00 AM</option>
                  <option value="14:00">02:00 PM</option>
                  <option value="15:30">03:30 PM</option>
                </select>
              </div>
            </div>

            <!-- Botón Submit -->
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-medium">Agendar Cita</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <!-- Script Oficial de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
