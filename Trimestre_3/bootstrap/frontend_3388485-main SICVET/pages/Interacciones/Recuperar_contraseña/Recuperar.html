<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar_contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../styles.css">
</head>
<body>
    <div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">
    
    
    <div class="col-lg-6 position-relative d-flex flex-column align-items-center justify-content-center p-4 min-vh-100 overflow-hidden bg-primary bg-opacity-10">


            <img src="/assets/dashboard/img/fondo registro.png" alt="Mascotas SICVET" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover">

        <!-- Capa de contenido superpuesta (z-1) -->
        <div class="position-relative z-1 text-center mb-3">
        <div class="bg-primary text-white rounded-4 d-inline-flex p-3 mb-2 shadow">
            <i class="bi bi-paw-fill fs-2"></i>
        </div>
        <h1 class="fw-bold mb-1 text-primary">SICVET</h1>
        <p class="fs-6 text-dark fw-semibold">
            La plataforma de gestión veterinaria<br>que tu clínica necesita.
        </p>
        </div>

    </div>

    <!-- PANEL DERECHO: Formulario Recuperar Contraseña -->
    <div class="col-lg-6 d-flex flex-column justify-content-center align-items-center p-4">
    
        <div class="w-100 sicvet-inline-style-004">
        
        <!-- Encabezado -->
        <div class="mb-4 text-center text-lg-start">
            <h2 class="fw-bold text-dark mb-1">¿Olvidaste tu contraseña?</h2>
            <p class="text-muted small">Ingresa tu correo electrónico registrado y te enviaremos un enlace para restablecerla.</p>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="card shadow-sm rounded-4 p-4 mb-3 border-light-subtle">
            <form>
            
            <!-- Correo Electrónico -->
            <div class="mb-4">
                <label class="form-label text-secondary fw-semibold small text-uppercase">Correo Electrónico</label>
                <div class="input-group">
                <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-start-0 ps-0" placeholder="juan@email.com" required>
                </div>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-medium">
                <i class="bi bi-send me-1"></i> Enviar Enlace
            </button>

            </form>
        </div>

        <!-- Enlaces de navegación -->
        <div class="text-center">
            <a href="/Home.html" class="text-primary text-decoration-none fw-semibold small">
            <i class="bi bi-arrow-left me-1"></i> Volver a Iniciar Sesión
            </a>
        </div>

    </div>

    </div>

    </div>
</div>
</body>
</html>
