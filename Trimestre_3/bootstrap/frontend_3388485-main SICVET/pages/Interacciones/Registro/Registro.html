<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../styles.css">
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">
    
    <!-- PANEL IZQUIERDO: Usando la etiqueta <img> directamente -->
    <div class="col-lg-6 position-relative d-flex flex-column align-items-center justify-content-center p-4 min-vh-100 overflow-hidden">

        <!-- AQUI ESTA LA ETIQUETA IMG -->
        <img src="/assets/dashboard/img/fondo registro.png" alt="Mascotas SICVET" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover">

        <!-- Capa de contenido por encima de la imagen (z-1) -->
        <div class="position-relative z-1 text-center mb-4">
        <div class="bg-primary text-white rounded-4 d-inline-flex p-3 mb-3 shadow">
            <i class="bi bi-paw-fill fs-2"></i>
        </div>
        <h1 class="fw-bold mb-2 text-primary">SICVET</h1>
        <p class="fs-6 text-dark fw-semibold">
            La plataforma de gestión veterinaria<br>que tu clínica necesita.
        </p>
</div>


    <div class="position-relative z-1 row g-3 w-75 sicvet-inline-style-005">
        <div class="col-6">
            <div class="bg-primary bg-opacity-75 text-white p-3 rounded-4 text-center shadow-sm">
            <h3 class="fw-bold mb-0">500+</h3>
            <small class="opacity-75">Clientes</small>
            </div>
        </div>
        <div class="col-6">
            <div class="bg-primary bg-opacity-75 text-white p-3 rounded-4 text-center shadow-sm">
            <h3 class="fw-bold mb-0">1,200+</h3>
            <small class="opacity-75">Mascotas</small>
            
        </div>
        </div>
        <div class="col-6">

            <div class="bg-primary bg-opacity-75 text-white p-3 rounded-4 text-center shadow-sm">
            <h3 class="fw-bold mb-0">98%</h3>
            <small class="opacity-75">Satisfacción</small>

        </div>
        </div>
        <div class="col-6">
            <div class="bg-primary bg-opacity-75 text-white p-3 rounded-4 text-center shadow-sm">
            <h3 class="fw-bold mb-0">24/7</h3>
            <small class="opacity-75">Soporte</small>
                </div>
            </div>
        </div>

    </div>

    <!-- PANEL DERECHO: Formulario de Registro -->
    <div class="col-lg-6 d-flex flex-column justify-content-center align-items-center p-4">

        <div class="w-100 sicvet-inline-style-004">
        
        <!-- Encabezado -->
        <div class="mb-4 text-center text-lg-start">
            <h2 class="fw-bold text-dark mb-1">Crear cuenta</h2>
            <p class="text-muted small">Tu rol será <strong class="text-primary">Cliente</strong> por defecto.</p>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="card shadow-sm rounded-4 p-4 mb-3 border-light-subtle">
            <form>
            
            <!-- Nombre Completo -->
            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold small text-uppercase">Nombre Completo</label>
                <div class="input-group">
                <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control border-start-0 ps-0" placeholder="Juan Pérez" required>
                </div>
            </div>

            <!-- Correo Electrónico -->
            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold small text-uppercase">Correo Electrónico</label>
                <div class="input-group">
                <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-start-0 ps-0" placeholder="juan@email.com" required>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="mb-3">
                <label class="form-label text-secondary fw-semibold small text-uppercase">Contraseña</label>
                <div class="input-group">
                <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" placeholder="Mínimo 8 caracteres" required>
                </div>
            </div>

            <!-- Confirmar Contraseña -->
            <div class="mb-4">
                <label class="form-label text-secondary fw-semibold small text-uppercase">Confirmar Contraseña</label>
                <div class="input-group">
                <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" placeholder="Repite tu contraseña" required>
                </div>
            </div>

            <!-- Botón Submit -->
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-medium">Crear Cuenta</button>

            </form>
        </div>

        <!-- Enlace de inicio de sesión -->
        <div class="text-center">
            <span class="text-muted small">¿Ya tienes cuenta?</span> 
            <a href="/Home.html" class="text-primary text-decoration-none fw-semibold small">Inicia sesión</a>
        </div>

        </div>

    </div>

    </div>
</div>

    
</body>
</html>
